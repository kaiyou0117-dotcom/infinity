<style>

  h1,h2{ font-family: var(--font-display); font-weight:700; margin:0; }

  .brand small{ display:block; font-family:var(--font-data); font-weight:500; font-size:9px; letter-spacing:0.16em; color:rgba(255,255,255,0.6); margin-top:2px; }
  .back-link{ font-family:var(--font-data); font-size:12.5px; letter-spacing:0.05em; color:rgba(255,255,255,0.8); border:1px solid rgba(255,255,255,0.4); padding:8px 16px; transition:border-color .2s; }
  .back-link:hover{ border-color:#fff; color:#fff; }

  .hero{ padding:64px 0 40px; border-bottom:1px solid var(--line); }
  .eyebrow{ font-family:var(--font-data); font-size:12px; letter-spacing:0.2em; color:var(--ink); text-transform:uppercase; display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .eyebrow::before{ content:""; width:26px; height:1px; background:var(--ink); }
  .hero h1{ font-size: clamp(28px,4vw,44px); }
  .hero p{ margin-top:14px; max-width:60ch; color:var(--text-muted); font-size:15px; }

  .filters{ display:flex; gap:10px; flex-wrap:wrap; margin-top:30px; }
  .filter-btn{
    font-family:var(--font-data); font-size:12px; letter-spacing:0.04em;
    padding:8px 16px; border:1px solid var(--line-strong); background:var(--bg);
    color:var(--text-muted); cursor:pointer; transition:.2s;

  .filter-btn.is-active, .filter-btn:hover{ background:var(--ink); color:var(--bg); border-color:var(--ink); }

  .roster-meta{
    display:flex; gap:28px; flex-wrap:wrap; margin-top:28px; padding-top:20px; border-top:1px solid var(--line);
    font-family:var(--font-data); font-size:12px; color:var(--text-faint);
  }
  .roster-meta b{ color:var(--gold); font-size:15px; margin-right:4px; }

  .roster-section{ padding:64px 0 110px; }
  .roster-grid{
    display:grid; grid-template-columns: repeat(2, 1fr); gap:18px;

  .roster-grid.cols-1{ grid-template-columns: 1fr; }
  .roster-grid.cols-2{ grid-template-columns: repeat(2, 1fr); }
  .roster-grid.cols-3{ grid-template-columns: repeat(3, 1fr); }
  .roster-grid.cols-4{ grid-template-columns: repeat(4, 1fr); }

  @media (max-width:760px){ .roster-grid{ grid-template-columns: 1fr !important; } }

  .view-switch{ display:flex; gap:6px; margin-left:auto; }
  .view-btn{
    width:34px; height:34px; border:1px solid var(--line-strong);

    font-family:var(--font-data); font-size:12px;
    display:flex; align-items:center; justify-content:center;
    transition:.2s;
  }
  .view-btn.is-active, .view-btn:hover{ background:var(--ink); color:var(--bg); border-color:var(--ink); }

  .emp-card{
    position:relative;
    background:var(--bg-panel); padding:30px 30px 26px;
    display:flex; flex-direction:column; gap:14px;
    opacity:0; transform:translateY(14px);
    animation: cardIn .5s ease forwards;
    border:1px solid var(--line);
    transition: background .25s ease, transform .25s ease, box-shadow .25s ease, border-color .25s ease;

  @keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }
  .emp-card:hover{
    background:var(--bg-panel-alt);
    transform:translateY(-5px);
    border-color:var(--line-strong);

  .emp-avatar{
    width:46px; height:46px; flex:none;

    font-family:var(--font-display); font-weight:800; font-size:18px;
    background:var(--blue); color:#fff;

  .emp-card.is-classified .emp-avatar{ background:var(--line-strong); color:var(--text-faint); }

  .emp-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }

  .emp-tag{

    border:1px solid var(--line-strong); padding:4px 10px; color:var(--text-muted);
  }
  .emp-tag.rank-tag{ border-color:transparent; color:#fff; }

  .emp-card.is-ace{ border-color:var(--gold); }
  .emp-card.is-ace:hover{ box-shadow: 0 18px 36px rgba(180,135,44,0.28); }

  .redact{
    height:14px; background: repeating-linear-gradient(90deg, var(--ink), var(--ink) 6px, transparent 6px, transparent 8px);

  }
  .redact.short{ width:40%; }
  .emp-card.is-classified .emp-name{ filter:blur(0.4px); }
  .classified-label{
    font-family:var(--font-data); font-size:10px; letter-spacing:0.12em; color:var(--text-faint);

  #emp-modal{
    position:fixed; inset:0; z-index:200;
    background:rgba(6,10,24,0.72);
    backdrop-filter: blur(6px);
    display:none;
    align-items:center; justify-content:center;
    padding:24px;
    opacity:0; transition:opacity 0.3s ease;
  }
  #emp-modal.is-open{ display:flex; opacity:1; }
  .modal-card{
    position:relative;
    width:100%; max-width:720px;
    max-height:85vh;
    display:flex; flex-direction:column;
    background:var(--bg);
    border:1px solid var(--line-strong);
    padding:48px 44px 40px;
    transform:translateY(20px) scale(0.96);
    transition:transform 0.3s cubic-bezier(.2,.8,.2,1);
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
  }
  #modal-body{
    overflow-y:auto;
    min-height:0;
    padding-right:6px;
    scrollbar-width: thin;
    scrollbar-color: var(--line-strong) transparent;
  }
  #modal-body::-webkit-scrollbar{ width:6px; }
  #modal-body::-webkit-scrollbar-track{ background:transparent; }
  #modal-body::-webkit-scrollbar-thumb{ background:var(--line-strong); }
  #emp-modal.is-open .modal-card{ transform:translateY(0) scale(1); }
  .modal-card::before, .modal-card::after,
  .modal-corner-br, .modal-corner-bl{
    content:""; position:absolute; width:18px; height:18px;
    border-color:var(--gold); border-style:solid; border-width:0;
  }
  .modal-card::before{ top:10px; left:10px; border-top-width:2px; border-left-width:2px; }
  .modal-card::after{ top:10px; right:10px; border-top-width:2px; border-right-width:2px; }
  .modal-corner-bl{ bottom:10px; left:10px; border-bottom-width:2px; border-left-width:2px; }
  .modal-corner-br{ bottom:10px; right:10px; border-bottom-width:2px; border-right-width:2px; }
  .modal-close{
    position:absolute; top:16px; right:16px;
    width:32px; height:32px; border:1px solid var(--line-strong);
    background:none; color:var(--text); cursor:pointer;
    font-family:var(--font-data); font-size:14px;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .2s ease, transform .2s ease;
  }
  .modal-close:hover{ border-color:var(--ink); transform:rotate(90deg); }
  .modal-meta-top{ display:flex; justify-content:space-between; align-items:center; }
  .modal-id{ font-family:var(--font-data); font-size:11px; letter-spacing:0.14em; color:var(--text-faint); }
  .modal-rank-row{ display:flex; align-items:center; gap:8px; }
  .modal-rank-dot{ width:12px; height:12px; border-radius:50%; flex:none; }
  .modal-rank-row .modal-note{ font-size:11px; }

  .modal-header{ display:flex; align-items:center; gap:18px; margin-top:20px; }
  .modal-avatar-lg{

  .modal-name{ font-family:var(--font-display); font-weight:800; font-size:26px; line-height:1.4; }

  .modal-tag.rank-tag{ border-color:transparent; color:#fff; }
  .modal-divider{ margin:24px 0 18px; border-top:1px solid var(--line); }
  .modal-note{ font-family:var(--font-data); font-size:11px; letter-spacing:0.06em; color:var(--text-faint); }
  .modal-fields-wrap{ display:flex; gap:22px; align-items:flex-start; margin-top:6px; }

  .modal-portrait{ width:220px; flex:none; overflow:hidden; }

  .modal-perf{ margin-top:10px; border-top:1px solid var(--line); padding-top:10px; }

  .modal-field{ padding:9px 0; border-top:1px solid var(--line); }

  .modal-field-label{
    font-family:var(--font-data); font-size:9.5px; letter-spacing:0.1em;

  }
  .modal-field-value{ margin-top:3px; font-size:12px; color:var(--text); line-height:1.6; }

  .modal-sections{ margin-top:26px; display:flex; flex-direction:column; gap:20px; }
  .modal-section h4{
    font-family:var(--font-data); font-size:11px; letter-spacing:0.12em;

  }
  .modal-section p{
    margin-top:8px; font-size:12.5px; color:var(--text-muted); line-height:1.9;
  }

  .modal-redact-block{ margin-top:20px; }
  .modal-redact-block .redact{ height:16px; margin-bottom:10px; }
  .modal-classified-stamp{
    display:inline-block; margin-top:22px;
    font-family:var(--font-data); font-size:12px; letter-spacing:0.18em;
    color:#B23A3A; border:2px solid #B23A3A; padding:6px 16px;
    transform:rotate(-4deg);
  }

  footer{ padding:36px 0; border-top:1px solid var(--line); text-align:center; }
  .foot-copy{ font-size:12px; color:var(--text-faint); font-family:var(--font-data); }
</style>

<footer>

  }
  var cardClass = 'emp-card' + (isClassified ? ' is-classified' : '') + (emp.isAce ? ' is-ace' : '');
  var html = '<div class="' + cardClass + '" data-dept="' + emp.dept.join(' ') + '" data-index="' + i + '" style="animation-delay:' + (Math.min(i,24) * 0.03) + 's">';
  html += '<div class="emp-top"><span class="emp-id">FILE IB-' + emp.id + '</span>' + rankDot + '</div>';
  if(isClassified){
    html += '<div class="emp-head-row"><div class="emp-avatar">？</div><div class="emp-name">' + emp.name + '</div></div>';
    html += '<div class="redact"></div><div class="redact short"></div>';
    html += '<div class="classified-label">INFORMATION CLASSIFIED</div>';
  } else {
    html += '<div class="emp-head-row"><div class="emp-avatar">' + emp.name.charAt(0) + '</div><div class="emp-name">' + emp.name + '</div></div>';
    html += '<div class="emp-tags">';
    emp.tags.forEach(function(t){ html += '<span class="emp-tag">' + t + '</span>'; });
    if(emp.rank){
      html += '<span class="emp-tag rank-tag" style="background:' + (RANK_COLOR[emp.rank] || '#999') + ';color:' + (RANK_TEXT[emp.rank] || '#fff') + '">' + emp.rank + '</span>';
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

var grid = document.getElementById('roster-grid');
grid.innerHTML = EMPLOYEES.map(cardHTML).join('');

var buttons = document.querySelectorAll('.filter-btn');
buttons.forEach(function(btn){
  btn.addEventListener('click', function(){
    buttons.forEach(function(b){ b.classList.remove('is-active'); });
    btn.classList.add('is-active');
    var f = btn.getAttribute('data-filter');
    document.querySelectorAll('.emp-card').forEach(function(card){
      var depts = card.getAttribute('data-dept').split(' ');
      card.style.display = (f === 'all' || depts.indexOf(f) !== -1) ? '' : 'none';
    });
  });
});

var viewButtons = document.querySelectorAll('.view-btn');
viewButtons.forEach(function(btn){
  btn.addEventListener('click', function(){
    viewButtons.forEach(function(b){ b.classList.remove('is-active'); });
    btn.classList.add('is-active');
    var cols = btn.getAttribute('data-cols');
    grid.className = 'roster-grid cols-' + cols;
    try{ localStorage.setItem('ib-roster-cols', cols); }catch(e){}
  });
});
try{
  var savedCols = localStorage.getItem('ib-roster-cols');
  if(savedCols){
    grid.className = 'roster-grid cols-' + savedCols;
    viewButtons.forEach(function(b){ b.classList.toggle('is-active', b.getAttribute('data-cols') === savedCols); });
  }
}catch(e){}

/* profile modal */
var overlay = document.getElementById('emp-modal');
var modalBody = document.getElementById('modal-body');
var modalClose = overlay.querySelector('.modal-close');

var DEPT_LABEL = { combat:'戦闘部', tech:'技術部', mgmt:'経営部' };

function buildModal(emp){
  var isClassified = emp.dept.indexOf('classified') !== -1;
  var html = '<div class="modal-meta-top"><span class="modal-id">FILE IB-' + emp.id + '</span>';
  if(!isClassified && emp.rank && !emp.noDot){
    html += '<span class="modal-rank-row"><span class="modal-rank-dot" style="background:' + (RANK_COLOR[emp.rank] || '#999') + '"></span><span class="modal-note">RANK — ' + emp.rank + '</span></span>';
  }
  html += '</div>';

  if(isClassified){
    html += '<div class="modal-header"><div class="modal-avatar-lg">？</div><div class="modal-name">' + emp.name + '</div></div>';
    html += '<div class="modal-redact-block"><div class="redact"></div><div class="redact short"></div></div>';
    html += '<div class="modal-classified-stamp">CLASSIFIED</div>';
  } else {
    html += '<div class="modal-header"><div class="modal-avatar-lg">' + emp.name.charAt(0) + '</div><div class="modal-name">' + (emp.fullName || emp.name) + '</div></div>';
    html += '<div class="modal-tags">';
    emp.tags.forEach(function(t){ html += '<span class="modal-tag">' + t + '</span>'; });
    if(emp.rank){
      html += '<span class="modal-tag rank-tag" style="background:' + (RANK_COLOR[emp.rank] || '#999') + ';color:' + (RANK_TEXT[emp.rank] || '#fff') + '">' + emp.rank + '</span>';
    }
    html += '</div>';

    var rows = [
      ['所属部署', emp.dept.map(function(d){ return DEPT_LABEL[d] || d; }).join('・')],
      ['ランク', emp.rank || '未評価'],
      ['情報開示区分', '公開'],
      ['在籍状況', '現役']
    ];
    if(emp.record){ rows = rows.concat(emp.record); }
    if(emp.portrait){ html += '<div class="modal-fields-wrap">'; }
    html += '<div class="modal-fields">';
    rows.forEach(function(r){
      html += '<div class="modal-field"><div class="modal-field-label">' + r[0] + '</div><div class="modal-field-value">' + r[1] + '</div></div>';
    });
    html += '</div>';
    if(emp.portrait){
      var perfHtml = '';
      if(emp.monthly){
        perfHtml += '<div class="modal-perf"><div class="modal-perf-head">今月の討伐進捗</div>';
        perfHtml += '<div class="modal-perf-map"><svg viewBox="0 0 300 308" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="今月の討伐箇所">';
        perfHtml += '<path class="mm2-outline" d="' + WARD_PATH + '"/>';
        emp.monthly.markers.forEach(function(m, mi){
          perfHtml += '<circle class="mm2-marker" cx="' + m.cx + '" cy="' + m.cy + '" r="' + (1.1 + m.level * 0.28) + '" fill="' + (LEVEL_COLOR[m.level] || '#B4872C') + '" style="animation-delay:' + (mi*0.06) + 's"/>';
        });
        perfHtml += '</svg></div>';
        perfHtml += '<div class="modal-perf-count"><b>' + emp.monthly.markers.length + '</b>件の討伐対応（今月）</div>';
        perfHtml += '</div>';
      }
      html += '<div class="modal-portrait"><img src="' + emp.portrait + '" alt="' + emp.name + 'のプロフィール画像">' + perfHtml + '</div>';
      html += '</div>';
    }

    if(emp.sections){
      html += '<div class="modal-sections">';
      emp.sections.forEach(function(s){
        html += '<div class="modal-section"><h4>' + s.title + '</h4><p>' + s.body + '</p></div>';
      });
      html += '</div>';
    }
  }

  html += '<div class="modal-divider"></div>';
  html += '<div class="modal-note">STATUS: 現役 ／ INFINITY BRAVE CO., LTD.</div>';
  return html;
}

function openModal(emp){
  modalBody.innerHTML = buildModal(emp);
  overlay.classList.add('is-open');
  overlay.setAttribute('aria-hidden', 'false');
  document.documentElement.style.overflow = 'hidden';
}
function closeModal(){
  overlay.classList.remove('is-open');
  overlay.setAttribute('aria-hidden', 'true');
  document.documentElement.style.overflow = '';
}

grid.addEventListener('click', function(e){
  var card = e.target.closest('.emp-card');
  if(!card) return;
  var idx = parseInt(card.getAttribute('data-index'), 10);
  openModal(EMPLOYEES[idx]);
});
modalClose.addEventListener('click', closeModal);
overlay.addEventListener('click', function(e){
  if(e.target === overlay) closeModal();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeModal();
});
</script>
</body>
</html>
